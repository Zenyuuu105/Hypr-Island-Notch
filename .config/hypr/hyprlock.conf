general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldWidth, 1, 6, easeOut
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/entity303069/Pictures/Wallpapers/deep-space/bunnies-road.png
    blur_passes = 1
    blur_size = 3
    noise = 0.008
    vibrancy = 0.12
    brightness = 0.88
    contrast = 1.0
}

# CLOCK (drawn image, no font)
image {
    monitor =
    path = /run/user/1000/lockclock-4-14.png
    size = 161
    rounding = 0
    border_size = 0
    reload_time = 1
    reload_cmd = /home/entity303069/.local/bin/lockclock
    position = 0, -34
    halign = center
    valign = center
}

# LOCK PILL (top): lock icon when empty, dots while typing
input-field {
    monitor =
    size = 64, 44
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.55)
    outer_color = rgba(0, 0, 0, 0)
    font_color = rgba(255, 255, 255, 0.90)
    check_color = rgba(255, 255, 255, 0.90)
    fail_color = rgba(255, 107, 107, 0.95)
    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span font_family="Symbols Nerd Font" font_size="xx-large" foreground="##ffffffcc"></span>
    fail_text = <i>$FAIL</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = top
}
